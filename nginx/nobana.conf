# Nobana — reverse proxy in front of the Next.js container.
#
# Before certificates exist, comment out the 443 block and the redirect,
# and let the :80 server proxy to app directly so certbot's webroot works.

upstream nobana_app {
    server app:3000;
    keepalive 32;
}

# Keeps websockets working while sending `close` for ordinary requests.
map $http_upgrade $proxy_connection {
    default upgrade;
    ''      close;
}

# Next.js already sets long-lived cache headers on /_next/static.
map $sent_http_content_type $nobana_gzip {
    default                     off;
    text/html                   on;
    text/css                    on;
    application/javascript      on;
    application/json            on;
    image/svg+xml               on;
    font/woff2                  off;  # already compressed
}

server {
    listen 80;
    listen [::]:80;
    server_name nobana.ir www.nobana.ir;

    # ACME challenge must stay reachable over plain HTTP for renewals.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nobana.ir www.nobana.ir;

    ssl_certificate     /etc/letsencrypt/live/nobana.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nobana.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Admin image uploads.
    client_max_body_size 20M;

    gzip             $nobana_gzip;
    gzip_vary        on;
    gzip_comp_level  6;
    gzip_min_length  1024;
    gzip_proxied     any;

    # Immutable build assets — let nginx answer from cache headers.
    location /_next/static/ {
        proxy_pass http://nobana_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://nobana_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $proxy_connection;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
